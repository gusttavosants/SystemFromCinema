<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="filmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0a" stroke="url(#filmGradient)" stroke-width="3"/>
  
  <!-- Film Strip -->
  <rect x="25" y="30" width="50" height="40" rx="3" fill="url(#filmGradient)"/>
  
  <!-- Film Holes -->
  <circle cx="30" cy="35" r="2" fill="#0a0a0a"/>
  <circle cx="30" cy="50" r="2" fill="#0a0a0a"/>
  <circle cx="30" cy="65" r="2" fill="#0a0a0a"/>
  
  <circle cx="70" cy="35" r="2" fill="#0a0a0a"/>
  <circle cx="70" cy="50" r="2" fill="#0a0a0a"/>
  <circle cx="70" cy="65" r="2" fill="#0a0a0a"/>
  
  <!-- Film Frames -->
  <rect x="38" y="35" width="10" height="10" fill="#0a0a0a" opacity="0.3"/>
  <rect x="52" y="35" width="10" height="10" fill="#0a0a0a" opacity="0.3"/>
  <rect x="38" y="55" width="10" height="10" fill="#0a0a0a" opacity="0.3"/>
  <rect x="52" y="55" width="10" height="10" fill="#0a0a0a" opacity="0.3"/>
  
  <!-- Play Button -->
  <circle cx="50" cy="50" r="12" fill="#fef2f2" opacity="0.9"/>
  <polygon points="47,45 47,55 56,50" fill="#dc2626"/>
</svg>
