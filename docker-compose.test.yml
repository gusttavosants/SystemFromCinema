version: '3.8'

services:
  zookeeper_test:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cinema_zookeeper_test
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2182:2181'
    volumes:
      - /var/lib/zookeeper/data
    networks:
      - cinema_test_network
    healthcheck:
      test: ['CMD', 'echo', 'ruok', '|', 'nc', 'localhost', '2181']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  kafka_test:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cinema_kafka_test
    depends_on:
      zookeeper_test:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_test:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_test:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - '9093:9092'
      - '29093:29093'
    volumes:
      - /var/lib/kafka/data
    networks:
      - cinema_test_network
    healthcheck:
      test:
        [
          'CMD',
          'kafka-broker-api-versions.sh',
          '--bootstrap-server',
          'localhost:9092',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres_test:
    image: postgres:15-alpine
    container_name: cinema_postgres_test
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cinema_test_db}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      - '5433:5432'
    volumes:
      - /var/lib/postgresql/data
    networks:
      - cinema_test_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cinema_test_db}',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  redis_test:
    image: redis:7-alpine
    container_name: cinema_redis_test
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '6380:6379'
    volumes:
      - /data
    networks:
      - cinema_test_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  cinema_test_network:
    driver: bridge
